<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AboScope – Abo-Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <main class="container">
    <section class="hero card">
      <p class="badge">KI + Websuche</p>
      <h1>AboScope</h1>
      <p class="subtitle">
        Trage deine Abos ein, wir holen uns automatisch Kontext aus dem Web und gruppieren deine Kosten übersichtlich.
      </p>
    </section>

    <section class="card input-panel">
      <h2>Deine Abos</h2>
      <p class="hint">Beispiel: Netflix – 12.99</p>
      <form id="subscription-form">
        <div id="rows"></div>

        <div class="actions">
          <button type="button" id="add-row" class="btn btn-secondary">+ Abo hinzufügen</button>
          <button type="submit" class="btn btn-primary">Analyse starten</button>
        </div>
      </form>
    </section>

    <section id="result" class="card result hidden"></section>
  </main>

  <template id="row-template">
    <div class="row">
      <input type="text" name="name" placeholder="Abo-Name (z.B. Netflix)" required />
      <input type="number" step="0.01" min="0" name="price" placeholder="Preis in €" required />
      <button type="button" class="delete" aria-label="Zeile löschen">✕</button>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
